services:
  anti-ddosia:
    build: .
    image: anti-ddosia:latest
    container_name: anti-ddosia
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Override any of these in a local .env file (see .env.example).
      PORT: 3000
      FEED_URL: ${FEED_URL:-https://witha.name/data/last.json}
      POLL_MINUTES: ${POLL_MINUTES:-1}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Optional email alerts (leave SMTP_HOST empty to disable):
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
    volumes:
      # Persist GeoIP cache + history. Bind-mounted so `node backfill.js` run
      # on the host is visible to the container (and vice versa).
      - ./data:/app/data
