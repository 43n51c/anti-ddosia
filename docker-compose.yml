services:
  anti-ddosia:
    build: .
    image: anti-ddosia:latest
    container_name: anti-ddosia
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Override any of these in a local .env file (see .env.example).
      PORT: 3000
      FEED_URL: ${FEED_URL:-https://witha.name/data/last.json}
      POLL_MINUTES: ${POLL_MINUTES:-1}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # History self-healing (auto backfill on first boot + every N hours). The
      # backfill caches config bodies under data/archive-cache, so daily rebuilds
      # only download new snapshots.
      AUTO_BACKFILL: ${AUTO_BACKFILL:-1}
      BACKFILL_HOURS: ${BACKFILL_HOURS:-24}
      ARCHIVE_URL: ${ARCHIVE_URL:-https://witha.name/data/}
      # Periodic consistent DB snapshots (VACUUM INTO) into data/backups, rotated.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-1}
      BACKUP_HOURS: ${BACKUP_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Optional email alerts (leave SMTP_HOST empty to disable):
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Optional social sign-in (leave empty to disable). Register redirect
      # URI <APP_URL>/auth/<provider>/callback in the provider console.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      # Persist GeoIP cache + history. Bind-mounted so `node backfill.js` run
      # on the host is visible to the container (and vice versa).
      - ./data:/app/data
